<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            text-align: left;
            padding: 12px 15px;
            background: rgba(255,255,255,0.07);
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        td {
            padding: 12px 15px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.85);
        }
        tr:hover td {
            background: rgba(255,255,255,0.03);
        }
        .delete-btn {
            padding: 6px 14px;
            background: rgba(255,99,99,0.2);
            border: 1px solid rgba(255,99,99,0.4);
            border-radius: 6px;
            color: #ff6363;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
        }
        .delete-btn:hover {
            background: rgba(255,99,99,0.4);
        }
        .no-users {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.4);
            font-size: 15px;
        }
        .total-badge {
            display: inline-block;
            background: linear-gradient(135deg, #4cc9f0, #4361ee);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>🌤️ Weather App</h1>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/users">Users</a>
            <form action="/logout" method="POST" style="display:inline">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container">

        <div class="card">
            <h3>
                👥 All Users
                <span class="total-badge" id="totalBadge">0 users</span>
            </h3>
            <p class="card-subtitle">
                View and manage all registered users
            </p>

            <div id="usersContainer">
                <p class="no-users">Loading users...</p>
            </div>

        </div>

    </div>

    <script>
        function escapeHtml(value) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(String(value)));
            return div.innerHTML;
        }

        const userIdMap = new Map();

        async function loadUsers() {
            const response = await fetch('/api/users');
            const users = await response.json();

            const container = document.getElementById('usersContainer');
            const badge = document.getElementById('totalBadge');

            badge.textContent = users.length + ' users';

            if (users.length === 0) {
                container.innerHTML =
                    '<p class="no-users">No users found!</p>';
                return;
            }

            userIdMap.clear();

            const table = document.createElement('table');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>City</th>
                        <th>Address</th>
                        <th>Action</th>
                    </tr>
                </thead>
            `;

            const tbody = document.createElement('tbody');
            users.forEach((user, index) => {
                const safeKey = 'user-' + index;
                userIdMap.set(safeKey, user._id);

                const tr = document.createElement('tr');
                tr.id = 'row-' + escapeHtml(user._id);

                const numTd = document.createElement('td');
                numTd.textContent = index + 1;

                const nameTd = document.createElement('td');
                nameTd.textContent = user.name;

                const cityTd = document.createElement('td');
                cityTd.textContent = user.city;

                const addressTd = document.createElement('td');
                addressTd.textContent = user.address;

                const actionTd = document.createElement('td');
                const btn = document.createElement('button');
                btn.className = 'delete-btn';
                btn.textContent = 'Delete';
                btn.addEventListener('click', () => deleteUser(user._id));
                actionTd.appendChild(btn);

                tr.append(numTd, nameTd, cityTd, addressTd, actionTd);
                tbody.appendChild(tr);
            });

            table.appendChild(tbody);
            container.innerHTML = '';
            container.appendChild(table);
        }

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) {
                return;
            }

            const response = await fetch(`/api/user/${encodeURIComponent(id)}`, {
                method: 'DELETE'
            });
            const data = await response.json();

            if (data.success) {
                document.getElementById('row-' + id).remove();
                loadUsers();
            } else {
                alert('Failed to delete user. Please try again.');
            }
        }

        loadUsers();
    </script>

</body>
</html>
