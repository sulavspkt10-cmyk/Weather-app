<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <h1>🌤️ Weather App</h1>
        <a href="/login" class="admin-btn">Admin Login</a>
    </nav>

    <div class="container">

        <!-- Weather Search Section -->
        <div class="card">
            <h2>Search Weather</h2>
            <p class="subtitle">Enter any city to get current weather</p>

            <div class="search-box">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name..."
                />
                <button onclick="getWeather()">Search</button>
            </div>

            <!-- Weather Result -->
            <div class="weather-result" id="weatherResult">
                <div class="weather-icon">🌡️</div>
                <div class="weather-info">
                    <h3 id="cityName"></h3>
                    <p id="weatherDesc"></p>
                    <div class="weather-stats">
                        <div class="stat">
                            <span class="stat-label">Temperature</span>
                            <span class="stat-value" id="temp"></span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Feels Like</span>
                            <span class="stat-value" id="feelsLike"></span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Humidity</span>
                            <span class="stat-value" id="humidity"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Error message -->
            <div class="error-box" id="errorBox">
                ❌ City not found! Please try again.
            </div>

        </div>

    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) {
                alert('Please enter a city name!');
                return;
            }

            // Hide previous results
            document.getElementById('weatherResult').style.display = 'none';
            document.getElementById('errorBox').style.display = 'none';

            try {
                const response = await fetch(`/weather?city=${city}`);
                const data = await response.json();

                if (data.error) {
                    document.getElementById('errorBox').style.display = 'block';
                    return;
                }

                // Show weather result
                document.getElementById('cityName').textContent = data.city;
                document.getElementById('weatherDesc').textContent = data.description;
                document.getElementById('temp').textContent = data.temperature + '°C';
                document.getElementById('feelsLike').textContent = data.feelsLike + '°C';
                document.getElementById('humidity').textContent = data.humidity + '%';
                document.getElementById('weatherResult').style.display = 'flex';

            } catch (error) {
                document.getElementById('errorBox').style.display = 'block';
            }
        }

        // Allow pressing Enter to search
        document.getElementById('cityInput')
            .addEventListener('keypress', function(e) {
                if (e.key === 'Enter') getWeather();
            });
    </script>

</body>
</html>
